# Codemagic 빌드 설정 — Mac 없이 클라우드에서 iOS 앱을 빌드/서명/제출하기 위한 파일
#
# 사용 전 Codemagic(codemagic.io)에서 아래 준비가 먼저 필요합니다:
#   1. GitHub 저장소 연결 (이 레포를 Codemagic 앱에 추가)
#   2. Apple 개발자 계정 결제 완료 후, App Store Connect에서 API 키 발급
#      (사용자 및 액세스 > 통합 > API 키 생성)
#   3. Codemagic > Teams > 앱 설정 > 통합(Integrations)에서 위 API 키 등록
#      → 여기서 등록한 이름을 아래 `integration_name`에 그대로 입력
#   4. Codemagic > 코드 서명(iOS code signing)에서 automatic signing 활성화
#      (Apple Developer 계정 로그인 연동하면 인증서/프로비저닝 프로파일 자동 관리됨)
#
# 위 준비가 끝나기 전까지는 이 파일이 있어도 빌드가 자동 실행되지 않습니다
# (아래 triggering을 git tag 기반으로만 걸어뒀어요 — 태그를 안 만들면 안 돌아감).
# 준비 끝나면 Codemagic 대시보드에서 이 workflow를 수동으로 한 번 실행해 테스트해보세요.

workflows:
  ios-capacitor-build:
    name: SPM iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # Codemagic 대시보드 > 환경 변수에서 아래 값들을 채워주세요 (지금은 비어있어도 무방)
      vars:
        BUNDLE_ID: "com.soccerpositionmanagement.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    # 자동 실행 방지 — 준비 안 된 상태에서 매 커밋마다 빌드가 돌면서 실패 알림이 쌓이는 걸 막기 위함
    # 실제로 빌드하고 싶을 때는 "ios-" 로 시작하는 git tag를 만들거나, Codemagic 대시보드에서 수동 실행
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-*"
          include: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Sync Capacitor (웹 설정 → 네이티브 프로젝트 반영)
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # 빌드 완료/실패 알림 받을 이메일
      email:
        recipients:
          - dkqpqp2@gmail.com
        notify:
          success: true
          failure: true

      # 준비 3번에서 등록한 App Store Connect API 키 통합 이름을 여기 넣으면
      # 빌드 성공 시 자동으로 TestFlight에 업로드됩니다 (앱스토어 정식 제출은 별도)
      app_store_connect:
        auth: integration
        integration_name: appstore_connect_api_key
        submit_to_testflight: true
        submit_to_app_store: false
