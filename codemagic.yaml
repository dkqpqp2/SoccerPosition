# Codemagic 빌드 설정 — Mac 없이 클라우드에서 iOS 앱을 빌드/서명/제출하기 위한 파일
#
# 이 iOS 프로젝트는 CocoaPods가 아니라 Swift Package Manager(SPM) 방식이다.
#   → Podfile / App.xcworkspace 가 없으므로 `pod install` 과 `--workspace` 를 쓰지 않고,
#     `ios/App/App.xcodeproj` 를 `--project` 로 직접 지정한다.
#
# 사용 전 Codemagic(codemagic.io)에서 아래 준비가 먼저 필요합니다:
#   1. GitHub 저장소 연결 (이 레포를 Codemagic 앱에 추가) — 완료됨
#   2. Apple Developer Program 가입 후, App Store Connect에서 API 키 발급
#      (사용자 및 액세스 > 통합 > API 키 생성)
#   3. Codemagic > Teams > 앱 설정 > 통합(Integrations)에서 위 API 키 등록
#      → 등록할 때 지정하는 이름을 아래 `integrations.app_store_connect`에 그대로 입력
#      (지금 파일엔 "appstore_connect_api_key" 로 넣어뒀으니 같은 이름으로 등록하거나, 등록한 이름으로 아래 값을 바꿔주세요)
#   4. 2, 3번이 끝나면 코드 서명은 자동으로 처리돼요 (environment.ios_signing 참고)
#   5. App Store Connect에 같은 번들 ID(com.soccerpositionmanagement.app)로 앱을 먼저 만들어 둘 것
#
# 위 준비가 끝나기 전까지는 이 파일이 있어도 빌드가 자동 실행되지 않습니다
# (아래 triggering을 git tag 기반으로만 걸어뒀어요 — 태그를 안 만들면 안 돌아감).
# 준비가 끝나면 Codemagic 대시보드에서 이 workflow를 수동으로 한 번 실행해 테스트해보세요.

workflows:
  ios-capacitor-build:
    name: SPM iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: appstore_connect_api_key

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.soccerpositionmanagement.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      # Capacitor CLI 8.x는 Node 22 이상이 필요하다 (20이면 `cap sync`가 실패)
      node: 22
      xcode: latest

    # 자동 실행 방지 — 준비 안 된 상태에서 매 커밋마다 빌드가 돌면서 실패 알림이 쌓이는 걸 막기 위함
    # 실제로 빌드하고 싶을 때는 "ios-" 로 시작하는 git tag를 만들거나, Codemagic 대시보드에서 수동 실행
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-*"
          include: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      # capacitor.config.ts의 webDir("out")이 없으면 `cap sync`가 실패한다.
      # 이 앱은 server.url로 운영 사이트를 불러오므로 안은 비어 있어도 되고, 폴더만 있으면 된다. (out은 git에 없음)
      - name: Prepare web assets directory
        script: |
          mkdir -p out
          [ -f out/index.html ] || echo '<!doctype html><title>SPM</title>' > out/index.html

      - name: Sync Capacitor (웹 설정 → 네이티브 프로젝트 반영)
        script: npx cap sync ios

      # 수출 규정 질문(암호화 사용 여부)을 매번 손으로 답하지 않도록 표준 HTTPS만 쓴다고 선언
      - name: Set Info.plist encryption flag
        script: |
          PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

      # TestFlight는 같은 버전에서 빌드 번호가 매번 커져야 업로드된다. Codemagic의 빌드 횟수를 그대로 사용.
      - name: Set build number
        script: |
          PBXPROJ="$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $PROJECT_BUILD_NUMBER;/g" "$PBXPROJ"
          grep -c "CURRENT_PROJECT_VERSION = $PROJECT_BUILD_NUMBER;" "$PBXPROJ"

      - name: Set up iOS code signing
        script: xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # 빌드 완료/실패 알림 받을 이메일
      email:
        recipients:
          - dkqpqp2@gmail.com
        notify:
          success: true
          failure: true

      # 위 integrations에서 등록한 App Store Connect API 키로 자동 인증됨
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
